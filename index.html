<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAST Floor Value Injector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root[data-theme="light"] {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-disabled: #c7d2fe;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-secondary: #4b5563;
            --input-bg: #f9fafb;
            --input-border: #d1d5db;
            --input-focus-ring: rgba(79, 70, 229, 0.2);
            --success: #059669;
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        :root[data-theme="dark"] {
            --primary: #6366f1;
            --primary-hover: #818cf8;
            --primary-disabled: #3730a3;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --input-bg: #334155;
            --input-border: #475569;
            --input-focus-ring: rgba(99, 102, 241, 0.4);
            --success: #34d399;
            --shadow-color: rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px var(--shadow-color), 0 8px 10px -6px var(--shadow-color);
            width: 100%;
            max-width: 900px;
            height: 100%;
            max-height: 95vh;
            padding: 1.5rem 2rem;
            box-sizing: border-box;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-shrink: 0;
        }

        .header-content {
            flex: 1;
            padding-right: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 0 0.25rem 0;
            color: var(--text-main);
            letter-spacing: -0.025em;
        }

        p.subtitle {
            color: var(--text-secondary);
            margin: 0;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--input-border);
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .theme-toggle:hover {
            color: var(--primary);
            border-color: var(--primary);
            background-color: var(--input-bg);
        }

        .icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* Form Layout */
        .form-group {
            margin-bottom: 0.75rem;
            flex-shrink: 0;
        }

        .form-group.flex-column-grow {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100px;
            /* Minimum height for input area */
            margin-bottom: 0.75rem;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 0.35rem;
            color: var(--text-main);
        }

        /* Inputs */
        textarea,
        input[type="text"] {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            padding: 0.75rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            color: var(--text-main);
            box-sizing: border-box;
            transition: all 0.2s;
        }

        .script-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Ensure textarea fills wrapper */
        textarea {
            resize: none;
            height: 100%;
        }

        textarea:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--input-focus-ring);
        }

        .code-input {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            line-height: 1.4;
        }

        #scriptInput,
        #scriptOutput {
            min-height: 0;
            /* Important for flex */
        }

        #scriptOutput {
            cursor: text;
        }

        /* Buttons */
        .btn-primary {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0;
            flex-shrink: 0;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px var(--input-focus-ring);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            background-color: var(--primary-disabled);
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* Output Section */
        .output-container {
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px dashed var(--input-border);
            transition: all 0.3s;

            /* Flex layout for output */
            flex: 1;
            display: none;
            /* Initially hidden */
            flex-direction: column;
            min-height: 0;
            overflow: hidden;

            opacity: 0;
            filter: blur(2px);
        }

        .output-container.active {
            display: flex;
            opacity: 1;
            filter: blur(0);
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            flex-shrink: 0;
        }

        .copy-btn {
            background: transparent;
            border: 1px solid var(--input-border);
            color: var(--text-secondary);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background-color: var(--input-bg);
        }

        .feedback {
            font-size: 0.8rem;
            color: var(--success);
            font-weight: 600;
            opacity: 0;
            transform: translateX(10px);
            transition: all 0.3s;
            margin-right: 10px;
        }

        .feedback.show {
            opacity: 1;
            transform: translateX(0);
        }

        /* Utilities */
        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-1px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(2px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-4px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(4px, 0, 0);
            }
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36, .07, .19, .97) both;
        }

        @media (max-width: 640px) {
            .container {
                padding: 1rem;
            }

            h1 {
                font-size: 1.25rem;
            }

            body {
                padding: 0.5rem;
            }
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--input-border);
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 0.75rem 0;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            color: var(--primary);
        }

        .tab-btn.active {
            color: var(--primary);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--primary);
        }

        .tab-content {
            display: none;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            /* Important for scroll */
            height: 100%;
        }

        .tab-content.active {
            display: flex;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            background: white;
            flex: 1;
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <div class="header-content">
                <h1>VAST Floor Value Injector</h1>
                <p class="subtitle">Securely inject floor prices into VAST scripts.</p>
            </div>
            <button class="theme-toggle" id="themeToggle" title="Toggle Theme">
                <!-- Sun Icon -->
                <svg class="icon sun-icon" viewBox="0 0 24 24" style="display: none;">
                    <path
                        d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z" />
                </svg>
                <!-- Moon Icon -->
                <svg class="icon moon-icon" viewBox="0 0 24 24">
                    <path
                        d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z" />
                </svg>
            </button>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-tab="injector">Injector</button>
            <button class="tab-btn" data-tab="testing">Testing</button>
        </div>

        <div id="injector" class="tab-content active">
            <div class="form-group flex-column-grow" id="inputSection">
                <label for="scriptInput">Ad Script</label>
                <div class="script-wrapper">
                    <textarea id="scriptInput" class="code-input" placeholder="<script>var s={vast:[...], ...}</script>"
                        spellcheck="false"></textarea>
                </div>
            </div>

            <div class="form-group">
                <label for="floorInput">Floor Values (comma separated)</label>
                <input type="text" id="floorInput" placeholder="e.g. 3, 2.25, 1.75" autocomplete="off">
            </div>

            <button id="generateBtn" class="btn-primary" disabled>Generate Updated Script</button>

            <div class="output-container" id="outputSection">
                <div class="output-header">
                    <label for="scriptOutput" style="margin:0">Output Script</label>
                    <div style="display:flex; align-items: center;">
                        <span class="feedback" id="copyFeedback">Copied!</span>
                        <button class="copy-btn" id="copyBtn">
                            <svg class="icon" viewBox="0 0 24 24">
                                <path
                                    d="M16 1H4C2.9 1 2 1.9 2 3V17H4V3H16V1ZM19 5H8C6.9 5 6 5.9 6 7V21C6 22.1 6.9 23 8 23H19C20.1 23 21 22.1 21 21V7C21 5.9 20.1 5 19 5ZM19 21H8V7H19V21Z" />
                            </svg>
                            Copy
                        </button>
                    </div>
                </div>
                <textarea id="scriptOutput" class="code-input" readonly spellcheck="false"></textarea>
            </div>
        </div>

        <div id="testing" class="tab-content">
            <iframe src="https://test-a-tag.com/" id="iframe" frameborder="0"></iframe>
        </div>
    </div>

    <script>
        // Elements
        const generateBtn = document.getElementById('generateBtn');
        const copyBtn = document.getElementById('copyBtn');
        const scriptInputEl = document.getElementById('scriptInput');
        const floorInputEl = document.getElementById('floorInput');
        const scriptOutputEl = document.getElementById('scriptOutput');
        const outputSectionEl = document.getElementById('outputSection');
        const copyFeedbackEl = document.getElementById('copyFeedback');
        const themeToggleBtn = document.getElementById('themeToggle');
        const sunIcon = themeToggleBtn.querySelector('.sun-icon');
        const moonIcon = themeToggleBtn.querySelector('.moon-icon');

        // Theme Logic
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);

            if (theme === 'dark') {
                sunIcon.style.display = 'block';
                moonIcon.style.display = 'none';
            } else {
                sunIcon.style.display = 'none';
                moonIcon.style.display = 'block';
            }
        }

        const savedTheme = localStorage.getItem('theme') || 'light';
        setTheme(savedTheme);

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            setTheme(newTheme);
        });

        // Tabs Logic
        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const targetTab = btn.getAttribute('data-tab');

                // Update Buttons
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // Update Content
                tabContents.forEach(content => {
                    content.classList.remove('active');
                    if (content.id === targetTab) {
                        content.classList.add('active');
                    }
                });
            });
        });

        // Validation
        function checkInputs() {
            const hasScript = scriptInputEl.value.trim().length > 0;
            const hasFloors = floorInputEl.value.trim().length > 0;
            generateBtn.disabled = !(hasScript && hasFloors);
        }

        scriptInputEl.addEventListener('input', checkInputs);
        floorInputEl.addEventListener('input', checkInputs);

        // Generation
        generateBtn.addEventListener('click', () => {
            const scriptInput = scriptInputEl.value;
            const floorInput = floorInputEl.value;

            if (!scriptInput.trim() || !floorInput.trim()) return;

            const floors = floorInput.split(',').map(v => v.trim()).filter(v => v !== "");

            const vastStartIndex = scriptInput.indexOf("vast:[");
            if (vastStartIndex === -1) {
                alert("Could not find 'vast:[' in the script.");
                shakeElement(scriptInputEl);
                return;
            }

            const arrayStartIndex = vastStartIndex + 5;
            let stack = 0;
            let arrayEndIndex = -1;
            let foundStart = false;

            for (let i = arrayStartIndex; i < scriptInput.length; i++) {
                const char = scriptInput[i];
                if (char === '[') { stack++; foundStart = true; }
                else if (char === ']') {
                    stack--;
                    if (foundStart && stack === 0) {
                        arrayEndIndex = i + 1;
                        break;
                    }
                }
            }

            if (arrayEndIndex === -1) {
                alert("Could not find closing bracket ']' for vast array.");
                shakeElement(scriptInputEl);
                return;
            }

            const vastArrayString = scriptInput.substring(arrayStartIndex, arrayEndIndex);

            let vastArray;
            try {
                const fixedJsonString = vastArrayString
                    .replace(/([{,]\s*)([a-zA-Z0-9_]+)\s*:/g, '$1"$2":')
                    .replace(/'/g, '"');
                vastArray = JSON.parse(fixedJsonString);
            } catch (e) {
                try {
                    vastArray = JSON.parse(vastArrayString);
                } catch (err2) {
                    alert("Could not parse VAST array. Check syntax.");
                    shakeElement(scriptInputEl);
                    return;
                }
            }

            if (floors.length !== vastArray.length) {
                alert(`Count mismatch: ${floors.length} floors provided for ${vastArray.length} items.`);
                shakeElement(floorInputEl);
                return;
            }

            const updatedVastArray = vastArray.map((item, index) => {
                let url = item.ad_url;
                const floor = floors[index];
                const param = `upr%3D${floor}`;

                if (url.includes("cust_params=")) {
                    url += `%26${param}`;
                } else {
                    url += `&cust_params=${param}`;
                }
                return { ...item, ad_url: url };
            });

            const finalScript = scriptInput.substring(0, arrayStartIndex) +
                JSON.stringify(updatedVastArray) +
                scriptInput.substring(arrayEndIndex);

            scriptOutputEl.value = finalScript;

            outputSectionEl.classList.add('active');
            // Because of flexbox reflow, we don't need to scrollIntoView in the same way, but it doesnt hurt
            scriptOutputEl.focus();
        });

        copyBtn.addEventListener('click', () => {
            if (!scriptOutputEl.value) return;
            scriptOutputEl.select();
            navigator.clipboard.writeText(scriptOutputEl.value).then(() => {
                copyFeedbackEl.classList.add('show');
                setTimeout(() => copyFeedbackEl.classList.remove('show'), 1500);
            });
        });

        function shakeElement(el) {
            el.classList.add('shake');
            el.addEventListener('animationend', () => el.classList.remove('shake'), { once: true });
        }
    </script>

</body>

</html>
